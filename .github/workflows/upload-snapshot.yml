name: Upload Lampa snapshot to R2

on:
  workflow_dispatch:
  # schedule:
  # Weekly refresh of the pinned Lampa source snapshot
  # - cron: "0 6 * * 1"

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Checkout Lampa source
        uses: actions/checkout@v4
        with:
          repository: yumata/lampa-source
          path: temp/lampa-source

      - name: Upload snapshot to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run snapshot:upload
