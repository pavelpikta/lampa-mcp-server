---
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: "deps"
      include: "scope"
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
      semantic-release:
        patterns:
          - "semantic-release"
          - "@semantic-release/*"
          - "conventional-changelog-*"
      cloudflare:
        patterns:
          - "wrangler"
          - "agents"
          - "@cloudflare/*"
      mcp:
        patterns:
          - "@modelcontextprotocol/*"
      types:
        patterns:
          - "@types/*"
      production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
    # Stay on TypeScript 6 until the toolchain (typescript-eslint, vue-tsc, …) supports 7.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      actions:
        patterns:
          - "*"
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
