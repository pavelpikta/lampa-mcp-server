---
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      npm-dependencies:
        dependency-type: "production"
      npm-dev-dependencies:
        dependency-type: "development"
    # Stay on TypeScript 6 until the toolchain (typescript-eslint, vue-tsc, …) supports 7.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
