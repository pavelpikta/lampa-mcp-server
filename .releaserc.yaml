branches:
  - main

plugins:
  - - "@semantic-release/commit-analyzer"
    - preset: conventionalcommits
      releaseRules:
        - type: deps
          release: false
        - type: chore
          release: false
        - type: ci
          release: false
        - type: docs
          release: false
        - type: test
          release: false
        - type: refactor
          release: patch

  - - "@semantic-release/release-notes-generator"
    - preset: conventionalcommits

  - - "@semantic-release/changelog"
    - changelogFile: CHANGELOG.md

  # Version bump only. @semantic-release/npm is not used: it installs the npm CLI,
  # whose bundled deps are the open Dependabot alerts. `npm` is overridden to a stub.
  - - "@semantic-release/exec"
    - prepareCmd: npm version ${nextRelease.version} --no-git-tag-version

  - - "@semantic-release/git"
    - assets:
        - CHANGELOG.md
        - package.json
        - package-lock.json
      message: |
        chore(release): ${nextRelease.version} [skip ci]

        ${nextRelease.notes}

  - "@semantic-release/github"
